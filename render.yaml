services:
  # ==========================================
  # 🌐 SERVIÇO PRINCIPAL (Laravel + Vue/Vite)
  # ==========================================
  - type: web
    name: psjbf-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: VITE_API_URL
        value: https://psjbf.onrender.com/api
      - key: QUEUE_CONNECTION
        value: database
    autoDeploy: true
    startCommand: |
      php artisan config:clear && \
      php artisan cache:clear && \
      php artisan config:cache && \
      php artisan migrate --force || true && \
      php artisan serve --host=0.0.0.0 --port=${PORT:-8000}

  # ==========================================
  # ⚙️ LARAVEL QUEUE WORKER (Processa jobs)
  # ==========================================
  - type: worker
    name: psjbf-queue-worker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    startCommand: |
      php artisan config:clear && \
      php artisan cache:clear && \
      php artisan config:cache && \
      php artisan queue:work --tries=3 --sleep=5
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: QUEUE_CONNECTION
        value: database
      - key: VITE_API_URL
        value: https://psjbf.onrender.com/api
